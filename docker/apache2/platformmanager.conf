<Location /update>
    Order deny,allow
    Deny from all
    Allow from 127.0.0.1
</Location>

<Location /data/resources/events>
  Deny from all
</Location>
<Location /data/quote>
  Deny from all
</Location>
<Location /data/booking>
  Deny from all
</Location>
<Location /data/services>
  Deny from all
</Location>
<Location /data/invoices>
  Deny from all
</Location>
<Location /data/bulletjournal>
  Deny from all
</Location>
<Location /data/statistics>
  Deny from all
</Location>
<Location /data/conventions>
  Deny from all
</Location>

<Directory "/var/www/html/data">
<FilesMatch ".+\.*$">
    SetHandler !
</FilesMatch>
</Directory>

ProxyRequests     off
ProxyPreserveHost on
#RequestHeader set "X-Forwarded-Proto" expr=%{REQUEST_SCHEME}
#RequestHeader set "X-Forwarded-SSL" expr=%{HTTPS}
#ProxyPass         /auth http://keycloak:8080/auth
#ProxyPassReverse  /auth http://keycloak:8080/auth
ProxyPass         /grafana http://grafana:3000/grafana
ProxyPassReverse  /grafana http://grafana:3000/grafana


# --- Security -------------------------------------------------------------
#
# Refuse the version-control directory. It is deliberately NOT removed from the
# image: the About screen and the command line tool both read the deployed
# version from it (git describe --tags), so deleting it would break a feature.
<LocationMatch "^/\.git">
    Require all denied
</LocationMatch>
<DirectoryMatch "^/var/www/.*/\.git">
    Require all denied
</DirectoryMatch>

# Headers on every response, error responses included ("always").
Header always set X-Frame-Options "DENY"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Content-Security-Policy.
#
# 'unsafe-inline' for scripts and styles: the views carry their scripts inline
# and set style attributes throughout. No view loads anything from an outside
# host, so restricting every source to the application itself costs nothing.
#
# 'unsafe-eval': the shipped Vue 3 build compiles in-DOM templates at runtime
# through new Function(). Removing it means precompiling templates or moving to
# the runtime-only build, which is a front-end change, not a configuration one.
#
# www.gravatar.com in img-src: the navbar builds every avatar URL from a hash of
# the User's email. Leaving it out blanks the avatar on every authenticated
# screen. Whether to keep sending that hash to a third party at all is a product
# decision, recorded in the audit report.
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.gravatar.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# The proxied metrics dashboard serves its own pages under its own rules.
<Location /grafana>
    Header always unset Content-Security-Policy
    Header always unset X-Frame-Options
</Location>

# --- Compression ----------------------------------------------------------
#
# Debian's deflate.conf already covers HTML, stylesheets, scripts and XML, but
# not JSON, which is what the front-end fetches on most screens. Listing every
# type here keeps the behaviour explicit rather than inherited.
<IfModule mod_filter.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml
    AddOutputFilterByType DEFLATE text/javascript application/javascript application/x-javascript
    AddOutputFilterByType DEFLATE application/json application/xml
</IfModule>
