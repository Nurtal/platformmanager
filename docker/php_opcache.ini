; Bytecode cache.
;
; The base image already ships opcache enabled; pinning it here means the
; guarantee does not depend on a base image default that can change.
;
; validate_timestamps stays on: development mode rewrites index.php when the
; container starts, and editing a source file in a mounted tree must take
; effect without rebuilding the image. revalidate_freq is the cost of that,
; and 2 seconds is short enough to go unnoticed.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
